# Copy into your package repository, replace OWNER, and enable workflow_dispatch.
# Disabled in this Action's own repository: this project is not an npm package.
name: Example npm publish
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run build --if-present
      - name: Diagnose npm Trusted Publishing
        uses: OWNER/oidc-publish-doctor@v1
        with:
          expected-owner: my-org
          expected-repository: my-package
          expected-workflow: example-publish.yml
      - run: npm publish
